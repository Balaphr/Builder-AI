name = "ai-website-builder"
main = "worker/src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "ai-builder-db"
database_id = "99e47476-2f92-4808-b7a0-9cfef14a09f0"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "ai-builder-media"

[[kv_namespaces]]
binding = "KV"
id = "6bc56716bc2c4e34bf0d2ad1748928a9"

[site]
bucket = "./public"

[build]
command = "vite build"
